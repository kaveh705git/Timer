<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⏳ تایمر قطع سرویس</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:Tahoma,Arial;background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);display:flex;justify-content:center;align-items:center;min-height:100vh;direction:rtl;padding:20px}
  .box{background:rgba(255,255,255,0.05);backdrop-filter:blur(20px);padding:45px 35px;border-radius:30px;box-shadow:0 25px 60px rgba(0,0,0,0.7);text-align:center;color:#fff;max-width:550px;width:100%;border:1px solid rgba(255,255,255,0.08)}
  .icon{font-size:50px;margin-bottom:10px}
  h2{color:#fff;font-size:20px;font-weight:700;margin-bottom:5px;letter-spacing:1px}
  .sub{color:rgba(255,255,255,0.6);font-size:15px;margin-bottom:30px}
  .timer-wrap{background:rgba(0,0,0,0.4);padding:25px 15px;border-radius:18px;margin-bottom:20px;border:1px solid rgba(0,212,255,0.15)}
  .timer{font-size:30px;font-weight:bold;font-family:'Courier New',monospace;color:#00d4ff;direction:ltr;letter-spacing:6px;text-shadow:0 0 30px rgba(0,212,255,0.3)}
  .days{font-size:18px;color:rgba(255,255,255,0.5);margin-top:5px}
  .warning{background:rgba(255,165,0,0.12);padding:12px 18px;border-radius:12px;color:#f5a623;font-size:14px;margin:15px 0 22px;border-right:3px solid #f5a623}
  .btn{display:inline-block;padding:14px 45px;background:linear-gradient(135deg,#e94560,#c23152);color:#fff;text-decoration:none;border-radius:50px;font-weight:bold;font-size:16px;transition:all 0.3s;border:none;cursor:pointer;box-shadow:0 8px 25px rgba(233,69,96,0.35)}
  .btn:hover{transform:translateY(-3px);box-shadow:0 12px 35px rgba(233,69,96,0.5)}
  .expired{color:#ff4757;font-size:34px;font-weight:bold;text-shadow:0 0 40px rgba(255,71,87,0.4)}
  .status-dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#2ed573;margin-left:8px;animation:pulse 1.5s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
  .footer{color:rgba(255,255,255,0.2);font-size:12px;margin-top:20px}
</style>
</head>
<body>

<div class="box">
  <div class="icon">⏰</div>
  <h2>زمان باقی‌مانده تا قطع سرویس</h2>
  <div class="sub">در صورت عدم پرداخت، دسترسی شما غیرفعال خواهد شد</div>

  <div class="timer-wrap">
    <div class="timer" id="countdown">--:--:--</div>
    <div class="days" id="daysDisplay"></div>
  </div>

  <div class="warning">
    <span class="status-dot"></span>
    ⚠️ لطفاً هرچه سریع‌تر نسبت به پرداخت اقدام کنید
  </div>

  <a class="btn" href="https://t.me/kaveh_6632">🔓 رفع توقف سرویس</a>
  <div class="footer">پشتیبانی ۲۴ ساعته-09182716632</div>
</div>

<script>
// ============================================
// 🕒 تاریخ قطع سرویس رو اینجا تنظیم کن
// ============================================
const targetTime = new Date(2026, 7, 30, 20, 59, 59).getTime();
//               سال  ماه  روز  ساعت  دقیقه  ثانیه
// ماه از 0 تا 11: فروردین=0، مرداد=7، اسفند=11
// ============================================

function updateTimer() {
  const now = Date.now();
  let diff = targetTime - now;

  if (diff <= 0) {
    document.getElementById('countdown').innerHTML = '<span class="expired">⛔ سرویس قطع شد</span>';
    document.getElementById('daysDisplay').textContent = 'برای فعال‌سازی مجدد با پشتیبانی تماس بگیرید';
    return;
  }

  const days = Math.floor(diff / 86400000);
  diff -= days * 86400000;
  const hours = Math.floor(diff / 3600000);
  diff -= hours * 3600000;
  const mins = Math.floor(diff / 60000);
  diff -= mins * 60000;
  const secs = Math.floor(diff / 1000);

  let display = '';
  if (days > 0) display = days + ' روز و ';
  display += String(hours).padStart(2, '0') + ':' +
             String(mins).padStart(2, '0') + ':' +
             String(secs).padStart(2, '0');

  document.getElementById('countdown').textContent = display;

  if (days > 0) {
    document.getElementById('daysDisplay').textContent = days + ' روز مانده تا پایان مهلت';
  } else {
    document.getElementById('daysDisplay').textContent = 'کمتر از ۲۴ ساعت باقی مانده ⏰';
  }
}

updateTimer();
setInterval(updateTimer, 1000);
</script>
</body>
</html>
